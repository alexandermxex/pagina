<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros NES</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        #game-container {
            text-align: center;
        }
        canvas {
            border: 4px solid #333;
            width: 512px;
            height: 480px;
            image-rendering: pixelated; /* Mantiene los píxeles nítidos de NES */
        }
        .controls {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Pantalla del juego -->
        <canvas id="nes-canvas" width="256" height="240"></canvas>
        
        <div class="controls">
            <p><strong>Controles:</strong> Flechas (Mover) | <strong>Z</strong> (Salto / A) | <strong>X</strong> (Correr / B) | <strong>Enter</strong> (Start) | <strong>Shift</strong> (Select)</p>
        </div>
    </div>

    <!-- Carga del motor de emulación idéntico a la consola NES -->
    <script src="https://unpkg.com/jsnes/dist/jsnes.min.js"></script>
    <script>
        const canvas = document.getElementById('nes-canvas');
        const ctx = canvas.getContext('2d');
        const imageData = ctx.createImageData(256, 240);
        const buf = new ArrayBuffer(imageData.data.length);
        const buf8 = new Uint8ClampedArray(buf);
        const buf32 = new Uint32Array(buf);

        // Configurar emulador JSNES
        const nes = new jsnes.NES({
            onFrame: function(frameBuffer) {
                for (let i = 0; i < frameBuffer.length; i++) {
                    buf32[i] = 0xFF000000 | frameBuffer[i];
                }
                imageData.data.set(buf8);
                ctx.putImageData(imageData, 0, 0);
            }
        });

        // Controles de teclado
        const keyboardMap = {
            38: jsnes.Controller.BUTTON_UP,
            40: jsnes.Controller.BUTTON_DOWN,
            37: jsnes.Controller.BUTTON_LEFT,
            39: jsnes.Controller.BUTTON_RIGHT,
            90: jsnes.Controller.BUTTON_A,      // Z
            88: jsnes.Controller.BUTTON_B,      // X
            16: jsnes.Controller.BUTTON_SELECT, // Shift
            13: jsnes.Controller.BUTTON_START   // Enter
        };

        window.addEventListener('keydown', (e) => {
            if (keyboardMap[e.keyCode] !== undefined) {
                nes.buttonDown(1, keyboardMap[e.keyCode]);
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keyboardMap[e.keyCode] !== undefined) {
                nes.buttonUp(1, keyboardMap[e.keyCode]);
                e.preventDefault();
            }
        });

        // Carga directa de la ROM original de Super Mario Bros
        fetch('https://raw.githubusercontent.com/bfirsh/jsnes-web/master/public/roms/Super%20Mario%20Bros.%20(Japan,%20USA).nes')
            .then(response => response.arrayBuffer())
            .then(buffer => {
                const binary = String.fromCharCode.apply(null, new Uint8Array(buffer));
                nes.loadROM(binary);
                
                // Ejecutar a 60 FPS exactos
                setInterval(() => {
                    nes.frame();
                }, 1000 / 60);
            })
            .catch(err => console.error("Error al cargar la ROM:", err));
    </script>
</body>
</html>

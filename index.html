<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros - Perfect Pixel Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #09090e;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(92, 148, 252, 0.3);
            border-radius: 8px;
            overflow: hidden;
            border: 4px solid #1a1a24;
            background: #5c94fc;
        }
        canvas { display: block; image-rendering: pixelated; }
        .hud {
            position: absolute;
            top: 14px; left: 24px; right: 24px;
            display: flex; justify-content: space-between;
            font-size: 16px; font-weight: 900;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none; z-index: 10;
        }
        .hud span { color: #f8b800; display: block; margin-top: 2px; }
        .controls {
            margin-top: 12px;
            background: #12121c;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 13px;
            display: flex; gap: 16px;
            border: 1px solid #222;
        }
        .key { color: #f8b800; font-weight: bold; background: #222; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="hud">
            <div>MARIO<br><span id="ui-score">000000</span></div>
            <div>MONEDAS<br><span id="ui-coins">🪙 x00</span></div>
            <div>MUNDO<br><span>1-1</span></div>
            <div>TIEMPO<br><span id="ui-time">400</span></div>
        </div>
        <!-- Canvas ajustado a 480px (15 filas exactas de 32px) -->
        <canvas id="gameCanvas" width="800" height="480"></canvas>
    </div>

    <div class="controls">
        <div>MOVER: <span class="key">←</span> <span class="key">→</span></div>
        <div>SALTAR: <span class="key">Z</span> / <span class="key">ESPACIO</span></div>
        <div>CORRER: <span class="key">X</span> / <span class="key">SHIFT</span></div>
    </div>

    <script>
        // =========================================================================
        // SINTETIZADOR DE AUDIO
        // =========================================================================
        class AudioEngine {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }
            play(type) {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);

                if (type === 'jump') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now); osc.stop(now + 0.12);
                } else if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(987, now);
                    osc.frequency.setValueAtTime(1318, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'stomp') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'powerup') {
                    osc.type = 'square';
                    [330, 392, 659, 523, 587, 784].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * 0.04));
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now); osc.stop(now + 0.25);
                } else if (type === 'break') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.linearRampToValueAtTime(30, now + 0.12);
                    gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now); osc.stop(now + 0.12);
                }
            }
        }
        const audio = new AudioEngine();

        // =========================================================================
        // GENERADOR DE SPRITES FIDELIDAD NES 1:1
        // =========================================================================
        const PALETTE = {
            R: '#d82800', B: '#00249c', S: '#fc9838', K: '#000000',
            Y: '#fcbc0e', C: '#a44400', G: '#00a800', D: '#005000',
            W: '#ffffff', O: '#d84800', L: '#b84418'
        };

        function buildSprite(map, scale = 2) {
            const canvas = document.createElement('canvas');
            canvas.width = map[0].length * scale;
            canvas.height = map.length * scale;
            const ctx = canvas.getContext('2d');
            for (let r = 0; r < map.length; r++) {
                for (let c = 0; c < map[r].length; c++) {
                    const char = map[r][c];
                    if (char !== '.') {
                        ctx.fillStyle = PALETTE[char] || '#fff';
                        ctx.fillRect(c * scale, r * scale, scale, scale);
                    }
                }
            }
            return canvas;
        }

        // MARIO CHICO: 16x16 matriz -> 32x32px en pantalla
        const SmallMarioSprites = {
            idle: buildSprite([
                ".....RRRRR......",
                "....RRRRRRRRR...",
                "....KKKSSKS.....",
                "...KSSSKSSSK....",
                "...KSSSKKKSS....",
                "...KKSSSSKK.....",
                ".....SSSSSS.....",
                "....RRRBRRR.....",
                "...RRRRBBRRRR...",
                "..SSRRRBBYBRRSS.",
                "..SSBBBBBBBBSS..",
                "...BBBBBBBBBB...",
                "...BBB....BBB...",
                "..CCCC....CCCC..",
                "..CCCC....CCCC..",
                "................"
            ], 2),
            jump: buildSprite([
                ".....RRRRR......",
                "....RRRRRRRRR...",
                "....KKKSSKS.....",
                "...KSSSKSSSK....",
                "...KSSSKKKSS....",
                "...KKSSSSKK.....",
                ".....SSSSSS.....",
                "..SSRRRBRRRSS...",
                ".SSRRRBBYBRRSS..",
                "..RRRBBBBBB.....",
                "...BBBBBBBB.....",
                "..CCCC...CCCC...",
                "..CCCC...CCCC...",
                "................",
                "................",
                "................"
            ], 2)
        };

        // MARIO GRANDE FIEL: 16x32 matriz -> 32x64px en pantalla
        const BigMarioSprites = {
            idle: buildSprite([
                ".....RRRRR......",
                "....RRRRRRRRR...",
                "....KKKSSKS.....",
                "...KSSSKSSSK....",
                "...KSSSKKKSS....",
                "...KKSSSSKK.....",
                ".....SSSSSS.....",
                "....RRRBRRR.....",
                "...RRRRBBRRRR...",
                "..SSRRRBBYBRRSS.",
                "..SSRRBBBBBBSS..",
                "...RRBBBBBBBB...",
                "...RRBBBBBBBB...",
                "..RRRRRRRRRRRR..",
                "..RRRRRRRRRRRR..",
                ".RRRRRRRRRRRRRR.",
                ".RRRRRRRRRRRRRR.",
                ".RRRRRRRRRRRRRR.",
                ".SSRRRRRRRRRRSS.",
                ".SSRRRRRRRRRRSS.",
                "..SSBBBBBBBBSS..",
                "...BBBBBBBBBB...",
                "...BBBB..BBBB...",
                "...BBB....BBB...",
                "..CCCC....CCCC..",
                "..CCCC....CCCC..",
                ".CCCC......CCCC.",
                ".CCCC......CCCC.",
                "................",
                "................",
                "................",
                "................"
            ], 2),
            jump: buildSprite([
                ".....RRRRR......",
                "....RRRRRRRRR...",
                "....KKKSSKS.....",
                "...KSSSKSSSK....",
                "...KSSSKKKSS....",
                "...KKSSSSKK.....",
                ".....SSSSSS.....",
                "..SSRRRBRRRSS...",
                ".SSRRRBBYBRRSS..",
                "..RRRBBBBBB.....",
                "...RRBBBBBB.....",
                "..RRRRRRRRRR....",
                "..RRRRRRRRRR....",
                ".RRRRRRRRRRRR...",
                ".SSRRRRRRRRSS...",
                "..SSBBBBBBSS....",
                "...BBBBBBBB.....",
                "..CCCC...CCCC...",
                "..CCCC...CCCC...",
                ".CCCC.....CCCC..",
                "................",
                "................",
                "................",
                "................",
                "................",
                "................",
                "................",
                "................",
                "................",
                "................",
                "................",
                "................"
            ], 2)
        };

        // ENEMIGO GOOMBA: 16x16 matriz -> 32x32px
        const GoombaSprite = buildSprite([
            "......CCCC......",
            "....CCCCCCC.....",
            "...CCCCCCCCCC...",
            "..CCCCCCCCCCCC..",
            "..CCWWCCCCWWCC..",
            "..CWWKWCCWWKWC..",
            "..CCCCCCKCCCCC..",
            "...CCCCKKCCCC...",
            "....CKKKKKKC....",
            "...CCCCCCCCCC...",
            "..CCCCCCCCCCCC..",
            ".CCCC........CCCC",
            ".CCCC........CCCC",
            "CCCC..........CCCC",
            "................",
            "................"
        ], 2);

        // CHAMPIÑÓN POWERUP: 16x16 matriz -> 32x32px
        const MushroomSprite = buildSprite([
            ".....RRRRRR.....",
            "...RRRRRRRRRR...",
            "..RRWWRRRRRWWR..",
            "..RRWWRRRRRWWR..",
            ".RRRRRRRRRRRRRR.",
            ".RRWWRRRRRRRWWR.",
            ".RRWWRRRRRRRWWR.",
            "..RRRRRRRRRRRR..",
            "...SSSSSSSSSS...",
            "...SSSSSSSSSS...",
            "...SSSSSSSSSS...",
            "...SSSSSSSSSS...",
            "....SSSSSSSS....",
            "................",
            "................",
            "................"
        ], 2);

        // =========================================================================
        // NIVELES Y ESTRUCTURA DE 15 FILAS (32px x 15 = 480px Alto Exacto)
        // =========================================================================
        const TILE_SIZE = 32;
        const levelData = [
            "                                                                                                                                                                                                            ",
            "                                                                                                                                                                                                            ",
            "                                                                                                                                                                                                            ",
            "                                                                                                                                                                                                            ",
            "                                                                                                                                                                                                            ",
            "                                                                                                                                                                                                            ",
            "                                                                                                                                                                                                            ",
            "                 ?  B?B?B                                      B?B                                                                                                                                          ",
            "                                                                                                                                                                                                            ",
            "                                        P1                                                                                   B?B                                                                            ",
            "                                P1      P2                                    P1                                            BBBBB                                                                           ",
            "                        P1      P2      P2                                    P2                                           BBBBBBB                                F                                         ",
            "                P1      P2      P2      P2                                    P2                                          BBBBBBBBB                               F                                         ",
            "GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG   GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
            "GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG   GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG"
        ];

        function checkAABB(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x &&
                   a.y < b.y + b.h && a.y + a.h > b.y;
        }

        class Player {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.w = 32; this.h = 32; // Pequeño
                this.vx = 0; this.vy = 0;
                this.grounded = false;
                this.facing = 'right';
                this.isBig = false;
                this.invulnerableTimer = 0;
            }

            makeBig() {
                if (!this.isBig) {
                    this.isBig = true;
                    this.y -= 32;
                    this.h = 64; // Grande exacto 2x
                    audio.play('powerup');
                }
            }

            takeDamage() {
                if (this.invulnerableTimer > 0) return false;
                if (this.isBig) {
                    this.isBig = false;
                    this.y += 32;
                    this.h = 32;
                    this.invulnerableTimer = 90;
                    return false;
                }
                return true;
            }

            update(keys, blocks) {
                if (this.invulnerableTimer > 0) this.invulnerableTimer--;

                const isRun = keys['x'] || keys['shift'];
                const accel = isRun ? 0.45 : 0.3;
                const maxSpeed = isRun ? 5.2 : 3.4;

                if (keys['arrowleft']) {
                    this.vx = Math.max(this.vx - accel, -maxSpeed);
                    this.facing = 'left';
                } else if (keys['arrowright']) {
                    this.vx = Math.min(this.vx + accel, maxSpeed);
                    this.facing = 'right';
                } else {
                    this.vx *= 0.82;
                    if (Math.abs(this.vx) < 0.1) this.vx = 0;
                }

                if ((keys['z'] || keys[' ']) && this.grounded) {
                    this.vy = this.isBig ? -12.5 : -11.0;
                    this.grounded = false;
                    audio.play('jump');
                }

                this.vy += 0.65;

                // Eje X
                this.x += this.vx;
                blocks.forEach(b => {
                    if (b.solid && checkAABB(this, b)) {
                        if (this.vx > 0) this.x = b.x - this.w;
                        else if (this.vx < 0) this.x = b.x + b.w;
                        this.vx = 0;
                    }
                });

                // Eje Y
                this.y += this.vy;
                this.grounded = false;
                blocks.forEach(b => {
                    if (b.solid && checkAABB(this, b)) {
                        if (this.vy > 0) {
                            this.y = b.y - this.h;
                            this.vy = 0;
                            this.grounded = true;
                        } else if (this.vy < 0) {
                            this.y = b.y + b.h;
                            this.vy = 0;
                            b.onHit(this);
                        }
                    }
                });
            }

            draw(ctx) {
                if (this.invulnerableTimer % 4 >= 2) return;

                ctx.save();
                ctx.translate(Math.floor(this.x), Math.floor(this.y));

                if (this.facing === 'left') {
                    ctx.scale(-1, 1);
                    ctx.translate(-this.w, 0);
                }

                const spriteSet = this.isBig ? BigMarioSprites : SmallMarioSprites;
                const sprite = !this.grounded ? spriteSet.jump : spriteSet.idle;
                
                // Dibujo 1:1 respetando proporciones pixel-perfect
                ctx.drawImage(sprite, 0, 0, this.w, this.h);
                ctx.restore();
            }
        }

        class Mushroom {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.w = 32; this.h = 32;
                this.vx = 1.5; this.vy = 0;
                this.active = true;
            }
            update(blocks) {
                if (!this.active) return;
                this.vy += 0.5;
                this.x += this.vx;

                blocks.forEach(b => {
                    if (b.solid && checkAABB(this, b)) {
                        this.vx *= -1;
                        if (this.vx > 0) this.x = b.x + b.w;
                        else this.x = b.x - this.w;
                    }
                });

                this.y += this.vy;
                blocks.forEach(b => {
                    if (b.solid && checkAABB(this, b)) {
                        if (this.vy > 0) {
                            this.y = b.y - this.h;
                            this.vy = 0;
                        }
                    }
                });
            }
            draw(ctx) {
                if (this.active) ctx.drawImage(MushroomSprite, Math.floor(this.x), Math.floor(this.y), this.w, this.h);
            }
        }

        class Goomba {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.w = 32; this.h = 32;
                this.vx = -1.0; this.vy = 0;
                this.alive = true;
            }
            update(blocks) {
                if (!this.alive) return;
                this.vy += 0.5;
                this.x += this.vx;

                blocks.forEach(b => {
                    if (b.solid && checkAABB(this, b)) this.vx *= -1;
                });

                this.y += this.vy;
                blocks.forEach(b => {
                    if (b.solid && checkAABB(this, b)) {
                        if (this.vy > 0) {
                            this.y = b.y - this.h;
                            this.vy = 0;
                        }
                    }
                });
            }
            draw(ctx) {
                if (this.alive) ctx.drawImage(GoombaSprite, Math.floor(this.x), Math.floor(this.y), this.w, this.h);
            }
        }

        class Block {
            constructor(x, y, type) {
                this.x = x; this.y = y;
                this.w = TILE_SIZE; this.h = TILE_SIZE;
                this.type = type;
                this.solid = type !== 'flag';
                this.active = true;
                this.bounceY = 0;
            }

            onHit(player) {
                if (this.type === 'q' && this.active) {
                    this.active = false;
                    this.bounceY = -5;
                    if (!player.isBig) {
                        game.mushrooms.push(new Mushroom(this.x, this.y - 32));
                        audio.play('coin');
                    } else {
                        game.score += 200; game.coins++;
                        audio.play('coin');
                    }
                } else if (this.type === 'brick') {
                    if (player.isBig) {
                        audio.play('break');
                        this.solid = false;
                        this.type = 'empty';
                    } else {
                        this.bounceY = -4;
                        audio.play('stomp');
                    }
                }
            }

            draw(ctx) {
                if (this.type === 'empty') return;
                if (this.bounceY < 0) this.bounceY += 1;

                ctx.save();
                ctx.translate(this.x, this.y + this.bounceY);

                if (this.type === 'ground') {
                    ctx.fillStyle = PALETTE.O; ctx.fillRect(0, 0, this.w, this.h);
                    ctx.fillStyle = PALETTE.G; ctx.fillRect(0, 0, this.w, 6);
                    ctx.strokeStyle = '#000'; ctx.strokeRect(0, 0, this.w, this.h);
                } else if (this.type === 'brick') {
                    ctx.fillStyle = PALETTE.L; ctx.fillRect(0, 0, this.w, this.h);
                    ctx.strokeStyle = '#000'; ctx.strokeRect(0, 0, this.w, this.h);
                } else if (this.type === 'q') {
                    ctx.fillStyle = this.active ? PALETTE.Y : '#6b4400';
                    ctx.fillRect(0, 0, this.w, this.h);
                    ctx.strokeStyle = '#000'; ctx.strokeRect(0, 0, this.w, this.h);
                    if (this.active) {
                        ctx.fillStyle = '#000'; ctx.font = 'bold 18px monospace';
                        ctx.fillText('?', 9, 23);
                    }
                } else if (this.type.startsWith('P')) {
                    ctx.fillStyle = PALETTE.G; ctx.fillRect(0, 0, this.w, this.h);
                    ctx.fillStyle = PALETTE.D; ctx.fillRect(this.w - 8, 0, 8, this.h);
                    ctx.strokeStyle = '#000'; ctx.strokeRect(0, 0, this.w, this.h);
                } else if (this.type === 'flag') {
                    ctx.fillStyle = '#fff'; ctx.fillRect(14, 0, 4, this.h);
                }

                ctx.restore();
            }
        }

        class Engine {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.keys = {};
                this.score = 0;
                this.coins = 0;
                this.time = 400;
                this.cameraX = 0;

                this.initWorld();

                window.addEventListener('keydown', e => {
                    this.keys[e.key.toLowerCase()] = true;
                    audio.init();
                });
                window.addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);

                setInterval(() => {
                    if (this.time > 0) this.time--;
                    document.getElementById('ui-time').innerText = String(this.time).padStart(3, '0');
                }, 1000);
            }

            initWorld() {
                this.player = new Player(80, 200);
                this.blocks = [];
                this.enemies = [];
                this.mushrooms = [];

                for (let r = 0; r < levelData.length; r++) {
                    for (let c = 0; c < levelData[r].length; c++) {
                        const ch = levelData[r][c];
                        if (ch === 'G') this.blocks.push(new Block(c * TILE_SIZE, r * TILE_SIZE, 'ground'));
                        else if (ch === 'B') this.blocks.push(new Block(c * TILE_SIZE, r * TILE_SIZE, 'brick'));
                        else if (ch === '?') this.blocks.push(new Block(c * TILE_SIZE, r * TILE_SIZE, 'q'));
                        else if (ch === 'P1' || ch === 'P2') this.blocks.push(new Block(c * TILE_SIZE, r * TILE_SIZE, ch));
                        else if (ch === 'F') this.blocks.push(new Block(c * TILE_SIZE, r * TILE_SIZE, 'flag'));
                    }
                }

                this.enemies.push(new Goomba(600, 300));
                this.enemies.push(new Goomba(1000, 300));
                this.enemies.push(new Goomba(1400, 300));
            }

            update() {
                this.player.update(this.keys, this.blocks);

                this.mushrooms.forEach(m => {
                    m.update(this.blocks);
                    if (m.active && checkAABB(this.player, m)) {
                        m.active = false;
                        this.player.makeBig();
                        this.score += 1000;
                    }
                });

                this.enemies.forEach(e => {
                    e.update(this.blocks);
                    if (e.alive && checkAABB(this.player, e)) {
                        if (this.player.vy > 0 && (this.player.y + this.player.h - this.player.vy) <= e.y + 16) {
                            e.alive = false;
                            this.player.vy = -8.0;
                            this.score += 100;
                            audio.play('stomp');
                        } else {
                            if (this.player.takeDamage()) this.initWorld();
                        }
                    }
                });

                document.getElementById('ui-score').innerText = String(this.score).padStart(6, '0');
                document.getElementById('ui-coins').innerText = `🪙 x${String(this.coins).padStart(2, '0')}`;

                if (this.player.x - this.cameraX > this.canvas.width / 2.5) {
                    this.cameraX = this.player.x - this.canvas.width / 2.5;
                }

                if (this.player.y > this.canvas.height + 60) this.initWorld();
            }

            render() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.save();
                this.ctx.translate(-Math.floor(this.cameraX), 0);

                this.blocks.forEach(b => b.draw(this.ctx));
                this.mushrooms.forEach(m => m.draw(this.ctx));
                this.enemies.forEach(e => e.draw(this.ctx));
                this.player.draw(this.ctx);

                this.ctx.restore();
            }

            loop() {
                this.update();
                this.render();
                requestAnimationFrame(() => this.loop());
            }
        }

        const game = new Engine();
        game.loop();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros - Edición Rosa</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        #game-container {
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.5);
            background-color: #5c94fc;
            position: relative;
        }

        canvas {
            display: block;
        }

        .controls-ui {
            background-color: #000;
            padding: 10px 20px;
            margin-top: 10px;
            border-radius: 8px;
            font-size: 14px;
            letter-spacing: 1px;
            text-align: center;
            border: 1px solid #333;
        }

        .key {
            background: #222;
            border: 1px solid #555;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="marioCanvas" width="600" height="500"></canvas>
    </div>

    <div class="controls-ui">
        MOVER: <span class="key">←</span> <span class="key">→</span> | 
        SALTAR: <span class="key">Z</span> / <span class="key">ESPACIO</span> | 
        CORRER / PODER: <span class="key">X</span>
    </div>

    <script>
        const canvas = document.getElementById("marioCanvas");
        const ctx = canvas.getContext("2d");

        // Configuración del juego
        const GRAVITY = 0.5;
        
        // Estado de teclas
        const keys = {
            left: false,
            right: false,
            jump: false,
            action: false
        };

        // Objeto Jugador (Mario)
        const mario = {
            x: 50,
            y: 300,
            width: 32,
            height: 48,
            vx: 0,
            vy: 0,
            speed: 4,
            jumpForce: 11,
            grounded: false,
            hasPinkPower: false,
            facing: 'right'
        };

        // Elementos del nivel (Plataformas y Bloques)
        const platforms = [
            // Suelo de ladrillo
            { x: 0, y: 440, width: 600, height: 60, type: 'ground' },
            // Plataforma izquierda con bloque ?
            { x: 50, y: 300, width: 120, height: 30, type: 'brick' },
            { x: 90, y: 180, width: 30, height: 30, type: 'question' },
            // Tubería verde central
            { x: 270, y: 370, width: 50, height: 70, type: 'pipe' },
            // Plataformas superiores (Rosa y Ladrillo)
            { x: 380, y: 260, width: 150, height: 30, type: 'brick' },
            { x: 420, y: 260, width: 30, height: 30, type: 'question' },
            { x: 410, y: 350, width: 120, height: 20, type: 'pink_brick' }
        ];

        // Items especiales (Poderes Rosas)
        const items = [
            { x: 425, y: 130, size: 24, type: 'pink_flower', collected: false },
            { x: 100, y: 90, size: 24, type: 'pink_star', collected: false }
        ];

        // Control de teclado
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'ArrowRight') keys.right = true;
            if (e.key === 'z' || e.key === 'Z' || e.key === ' ') keys.jump = true;
            if (e.key === 'x' || e.key === 'X') keys.action = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
            if (e.key === 'z' || e.key === 'Z' || e.key === ' ') keys.jump = false;
            if (e.key === 'x' || e.key === 'X') keys.action = false;
        });

        // Bucle de actualización lógica
        function update() {
            // Movimiento horizontal
            if (keys.left) {
                mario.vx = -mario.speed;
                mario.facing = 'left';
            } else if (keys.right) {
                mario.vx = mario.speed;
                mario.facing = 'right';
            } else {
                mario.vx = 0;
            }

            // Salto
            if (keys.jump && mario.grounded) {
                mario.vy = -mario.jumpForce;
                mario.grounded = false;
            }

            // Aplicar gravedad
            mario.vy += GRAVITY;

            // Actualizar posiciones
            mario.x += mario.vx;
            mario.y += mario.vy;

            // Colisiones con paredes
            if (mario.x < 0) mario.x = 0;
            if (mario.x + mario.width > canvas.width) mario.x = canvas.width - mario.width;

            // Colisiones con plataformas
            mario.grounded = false;
            for (let plat of platforms) {
                if (
                    mario.x < plat.x + plat.width &&
                    mario.x + mario.width > plat.x &&
                    mario.y + mario.height >= plat.y &&
                    mario.y + mario.height <= plat.y + plat.height &&
                    mario.vy >= 0
                ) {
                    mario.grounded = true;
                    mario.vy = 0;
                    mario.y = plat.y - mario.height;
                }
            }

            // Recoger Poderes Rosas
            for (let item of items) {
                if (!item.collected &&
                    mario.x < item.x + item.size &&
                    mario.x + mario.width > item.x &&
                    mario.y < item.y + item.size &&
                    mario.y + mario.height > item.y) {
                    
                    item.collected = true;
                    mario.hasPinkPower = true;
                }
            }
        }

        // Renderizado gráfico
        function draw() {
            // Fondo de cielo
            ctx.fillStyle = "#5c94fc";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibuja nubes decorativas
            drawCloud(100, 80);
            drawCloud(400, 60);

            // Dibujar plataformas y bloques
            for (let plat of platforms) {
                if (plat.type === 'ground' || plat.type === 'brick') {
                    ctx.fillStyle = "#d84800"; // Ladrillo rojo/marrón clásico
                    ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                    ctx.strokeStyle = "#000";
                    ctx.strokeRect(plat.x, plat.y, plat.width, plat.height);
                } else if (plat.type === 'question') {
                    ctx.fillStyle = "#fc9838"; // Bloque ? amarillo/naranja
                    ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                    ctx.fillStyle = "#000";
                    ctx.font = "bold 20px Arial";
                    ctx.fillText("?", plat.x + 8, plat.y + 22);
                } else if (plat.type === 'pipe') {
                    ctx.fillStyle = "#00a800"; // Tubería verde
                    ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                    ctx.fillStyle = "#008800";
                    ctx.fillRect(plat.x - 4, plat.y, plat.width + 8, 15);
                } else if (plat.type === 'pink_brick') {
                    ctx.fillStyle = "#ff69b4"; // Ladrillo rosa
                    ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                }
            }

            // Dibujar Items (Flor Rosa / Estrella Rosa)
            for (let item of items) {
                if (!item.collected) {
                    if (item.type === 'pink_flower') {
                        ctx.fillStyle = "#ff1493";
                        ctx.beginPath();
                        ctx.arc(item.x + 12, item.y + 12, 12, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "#fff";
                        ctx.beginPath();
                        ctx.arc(item.x + 12, item.y + 12, 5, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (item.type === 'pink_star') {
                        ctx.fillStyle = "#ffb6c1";
                        ctx.fillRect(item.x, item.y, item.size, item.size);
                    }
                }
            }

            // Dibujar a Mario
            drawMario(mario.x, mario.y, mario.facing, mario.hasPinkPower);
        }

        // Función para renderizar el Sprite de Mario
        function drawMario(x, y, facing, isPink) {
            ctx.save();
            
            // Aura de poder rosa si recolectó la flor
            if (isPink) {
                ctx.shadowColor = "#ff007f";
                ctx.shadowBlur = 15;
            }

            // Sombrero Rojo / Rosa
            ctx.fillStyle = isPink ? "#ff1493" : "#ff0000";
            ctx.fillRect(x + 4, y, 24, 8);

            // Cara / Piel
            ctx.fillStyle = "#ffcca0";
            ctx.fillRect(x + 6, y + 8, 20, 10);

            // Bigote y ojos
            ctx.fillStyle = "#000";
            ctx.fillRect(facing === 'right' ? x + 18 : x + 6, y + 12, 8, 4);

            // Camisa
            ctx.fillStyle = isPink ? "#ffb6c1" : "#ff0000";
            ctx.fillRect(x + 4, y + 18, 24, 12);

            // Overol Azul / Rosa
            ctx.fillStyle = isPink ? "#c71585" : "#0000ff";
            ctx.fillRect(x + 6, y + 26, 20, 14);

            // Botones amarillos
            ctx.fillStyle = "#ffff00";
            ctx.fillRect(x + 8, y + 30, 4, 4);
            ctx.fillRect(x + 20, y + 30, 4, 4);

            // Zapatos
            ctx.fillStyle = "#8b4513";
            ctx.fillRect(x + 2, y + 40, 12, 8);
            ctx.fillRect(x + 18, y + 40, 12, 8);

            ctx.restore();
        }

        // Función auxiliar para nubes
        function drawCloud(x, y) {
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(x, y, 15, 0, Math.PI * 2);
            ctx.arc(x + 15, y - 10, 20, 0, Math.PI * 2);
            ctx.arc(x + 35, y, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        // Ciclo principal
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
